<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>One Piece Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <!-- start skärm -->
        <div id="start-screen">
            <h1>One Piece Quiz</h1>
            <p>Test your knowledge of the One Piece!</p>
            <input type="text" id="player-name" placeholder="Enter your name to start the quiz" maxlength="15">
            <div class="start-buttons">
                <button id="start-btn" class="action-btn">Start Quiz</button>
                <button id="clear-leaderboard-btn" class="secondary-btn">Reset Leaderboard</button>
            </div>
            <p id="name-error" class="error-msg hidden">You must enter a name to start!</p>
            <p id="clear-msg" class="success-msg hidden">Leaderboard has been cleared!</p>
        </div>

        <!-- quiz skärm -->
        <div id="quiz-screen" class="hidden">
            <div class="header-info">
                <span id="question-counter">Question 1 of 5</span>
                <span id="score-display">Score: 0</span>
            </div>

            <img id="question-image" src="" alt="One Piece clue">
            <h2 id="question-text">Loading question...</h2>

            <div id="answer-buttons" class="btn-grid">
                <!-- svarsknapparna skapas med js -->
            </div>

            <div id="feedback-container" class="hidden">
                <p id="feedback-text"></p>
                <button id="next-btn" class="action-btn">Next Question</button>
            </div>
        </div>

        <!-- resultat och leaderboard -->
        <div id="end-screen" class="hidden">
            <h1>Quiz Completed!</h1>
            <p id="final-score-text"></p>

            <div class="leaderboard-box">
                <h2>Quiz Leaderboard</h2>
                <ol id="leaderboard-list"></ol>
            </div>

            <button id="restart-btn" class="action-btn">Play Again (New Name)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
